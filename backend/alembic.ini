[alembic]
script_location = alembic
# В контейнере shared/ лежит внутри рабочей папки, при локальном запуске —
# уровнем выше; добавляем оба пути.
prepend_sys_path = . ..
timezone = UTC
version_path_separator = os
# URL берётся из настроек в alembic/env.py — здесь не дублируем.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
